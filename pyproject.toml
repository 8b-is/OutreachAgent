readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "8b-is", email = "cabotage@pm.me" },
]
keywords = ["agentfield", "outreach", "cloakbrowser", "multi-agent", "8b-is", "linkedin", "whatsapp"]
dependencies = [
    "agentfield>=0.1.35",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "playwright>=1.48.0",
    "cloakbrowser>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/8b-is/OutreachAgent"
